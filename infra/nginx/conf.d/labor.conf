proxy_cache_path /var/cache/nginx/assets levels=1:2 keys_zone=assets_cache:10m max_size=256m inactive=60m use_temp_path=off;

upstream backend {
  server backend:3000;
  keepalive 32;
}

upstream store {
  server store:3002;
  keepalive 32;
}

# Redirect HTTP to HTTPS
server {
  listen 80;
  server_name laborparfum.com www.laborparfum.com;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl http2;
  server_name laborparfum.com www.laborparfum.com;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  client_max_body_size 25M;

  # Docker embedded DNS — defers upstream resolution to request time
  resolver 127.0.0.11 valid=30s ipv6=off;

  # Spree Admin
  location /admin {
    proxy_pass http://backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Spree API
  location /api/v2/ {
    proxy_pass http://backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Rails assets (Spree Admin Tailwind styles, TinyMCE, etc.)
  location /assets/ {
    proxy_pass http://backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    proxy_cache assets_cache;
    proxy_cache_valid 200 302 30d;
    proxy_cache_valid 404 1m;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_lock on;
    add_header X-Cache-Status $upstream_cache_status;
    
    expires max;
    add_header Cache-Control public;
  }

  # Spree OAuth
  location /spree_oauth/ {
    proxy_pass http://backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Telegram bot webhook — variable forces per-request DNS so nginx starts
  # even when the bot container is down (placeholder token → exited).
  location = /telegram/webhook {
    set $bot_upstream http://bot:8080;
    proxy_pass $bot_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Rails ActiveStorage
  location /rails/active_storage/ {
    proxy_pass http://backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    proxy_cache assets_cache;
    proxy_cache_valid 200 302 30d;
    proxy_cache_valid 404 1m;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_lock on;
    add_header X-Cache-Status $upstream_cache_status;
  }

  # Direct ActiveStorage local disk serving
  location ~ "^/storage/([0-9a-z]{2})([0-9a-z]{2})([0-9a-z]+)/.+" {
    alias /usr/share/nginx/html/storage/$1/$2/$1$2$3;
    expires max;
    add_header Cache-Control public;
  }

  # Everything else → Next.js (apps/store)
  location / {
    proxy_pass http://store;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
