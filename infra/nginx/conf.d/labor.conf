upstream store {
  server store:3002;
  keepalive 32;
}

# Redirect HTTP to HTTPS
server {
  listen 80;
  server_name laborparfum.com www.laborparfum.com;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl http2;
  server_name laborparfum.com www.laborparfum.com;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  client_max_body_size 25M;

  # Docker embedded DNS — defers upstream resolution to request time
  resolver 127.0.0.11 valid=30s ipv6=off;

  # Product photos: the files the old Spree admin stored on disk (the
  # labor_backend_storage volume), at the /storage/... URLs the catalog keeps.
  location ~ "^/storage/([0-9a-z]{2})([0-9a-z]{2})([0-9a-z]+)/.+" {
    alias /usr/share/nginx/html/storage/$1/$2/$1$2$3;
    expires max;
    add_header Cache-Control public;
  }

  # Everything else → Next.js (apps/store)
  location / {
    proxy_pass http://store;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
