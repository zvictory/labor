name: labor

# Production: the store, its Postgres, the Telegram bot and nginx in front. The
# earlier Spree stack (Rails, Sidekiq, the old storefront, Redis) is gone.
# Locally the store runs without Docker (see CLAUDE.md).

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-labor_dev}
      POSTGRES_USER: ${POSTGRES_USER:-labor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published to the host: the store reaches it at postgres:5432.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-labor}"]
      interval: 5s
      timeout: 5s
      retries: 10

  store:
    build:
      context: ..
      dockerfile: apps/store/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://laborparfum.com}
        NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME:-}
        NEXT_PUBLIC_MINIAPP_URL: ${NEXT_PUBLIC_MINIAPP_URL:-}
        NEXT_PUBLIC_YANDEX_METRICA_ID: ${NEXT_PUBLIC_YANDEX_METRICA_ID:-}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
        NEXT_PUBLIC_META_PIXEL_ID: ${NEXT_PUBLIC_META_PIXEL_ID:-}
    restart: unless-stopped
    env_file: ../.env
    environment:
      # The store's own database. POSTGRES_DB (labor_production) still holds the old
      # Spree data, kept for the record and for scripts/etl; nothing reads it at runtime.
      DATABASE_URL: postgres://${POSTGRES_USER:-labor}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${STORE_DB:-labor_store}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://laborparfum.com}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3002"

  # The live @laborparfum_bot: Telegram's webhook points at it (/telegram/webhook),
  # and the bot is connected to Billz (labor.billz.io). Kept exactly as it ran;
  # don't move its webhook. Its one Spree call (saving the language) now fails
  # quietly, as the code already allows.
  bot:
    build:
      context: ..
      dockerfile: apps/bot/Dockerfile
    restart: on-failure
    env_file: ../.env

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      # The catalog photos, served at /storage/... (the URLs in the database).
      - product_images:/usr/share/nginx/html/storage:ro
    depends_on:
      - store
      - bot

volumes:
  pgdata:
  # The product photos, uploaded through the old Spree admin and still the files
  # behind every /storage/... image URL. External, so compose never creates or
  # removes it: a missing volume stops the deploy instead of serving a site with
  # no pictures. On a fresh server: docker volume create labor_backend_storage
  product_images:
    external: true
    name: labor_backend_storage
